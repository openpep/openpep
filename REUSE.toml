version = 1
SPDX-PackageName = "OpenPEP"
SPDX-PackageSupplier = "Carlos Pedrotti and OpenPEP contributors <https://github.com/openpep/openpep>"
SPDX-PackageDownloadLocation = "https://github.com/openpep/openpep"

[[annotations]]
path = [
    ".editorconfig",
    ".gitignore",
    ".node-version",
    ".swift-version",
    "Brewfile",
    "Makefile",
    "REUSE.toml",
    ".github/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti and OpenPEP contributors <https://github.com/openpep/openpep>"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
    "README.md",
    "CONTRIBUTING.md",
    "DISCLAIMER-SAUDE.md",
    "LICENSING.md",
    "NOTICE",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti and OpenPEP contributors <https://github.com/openpep/openpep>"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "apps/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti and OpenPEP contributors <https://github.com/openpep/openpep>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["packages/**", "tools/**", "scripts/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti and OpenPEP contributors <https://github.com/openpep/openpep>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "fixtures/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti and OpenPEP contributors <https://github.com/openpep/openpep>"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "assets/brand/openpep-logo.png"
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-OpenPEP-Brand"

[[annotations]]
path = "DCO"
precedence = "override"
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO-1.1"

[[annotations]]
path = "LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc. <https://fsf.org>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "apps/macos/OpenPEP/Resources/cid10-br-2008.tsv"
precedence = "override"
SPDX-FileCopyrightText = "CBCD/FSP-USP, OMS e OPAS — tradução brasileira CID-10; disseminação DATASUS"
SPDX-License-Identifier = "LicenseRef-CID10-DATASUS"

[[annotations]]
path = ["apps/macos/OpenPEP/Resources/snomed-ips-20240701.tsv", "apps/macos/OpenPEP/Resources/snomed-ips-NOTICE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2002-2024 International Health Terminology Standards Development Organisation"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "apps/macos/OpenPEP/Resources/CockpitPDF/*.ttf"
precedence = "override"
SPDX-FileCopyrightText = "The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["apps/macos/OpenPEP/Resources/CockpitPDF/renderer.js", "apps/macos/OpenPEP/Resources/CockpitPDF/THIRD-PARTY-NOTICES.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti; pdf-lib, fontkit, qrcode, dijkstrajs and pako contributors; see THIRD-PARTY-NOTICES.txt"
SPDX-License-Identifier = "Apache-2.0 AND MIT AND Zlib"

[[annotations]]
path = "apps/macos/OpenPEP/Resources/CockpitPDF/Inter-OFL.txt"
precedence = "override"
SPDX-FileCopyrightText = "The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["website/*.html", "website/*.js", "website/vercel.json", "website/rx/*.html", "website/rx/*.js", "website/rx/*.css"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti and OpenPEP contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "website/ASSETS.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti and OpenPEP contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["website/assets/screenshots/*.png", "website/assets/screenshots/*.webp"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti and OpenPEP contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["website/assets/openpep-logo.png", "website/rx/assets/openpep-logo.png"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-OpenPEP-Brand"

[[annotations]]
path = ["website/src/*.css", "website/package.json", "website/package-lock.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti and OpenPEP contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "website/style.css"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Carlos Pedrotti and OpenPEP contributors", "Tailwind Labs, Inc."]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT"

[[annotations]]
path = "website/TAILWIND-LICENSE.txt"
precedence = "override"
SPDX-FileCopyrightText = "Tailwind Labs, Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["website/assets/fonts/*", "website/rx/assets/*.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "The Inter Project Authors (https://rsms.me/inter/)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["website/assets/images/*", "website/assets/video/*", "website/rx/assets/*.jpg", "website/rx/assets/*.mp4", "website/rx/assets/anvisa-sncr.png", "website/rx/assets/icp-brasil.png"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti and OpenPEP contributors; third-party marks and generated media retain their respective rights"
SPDX-License-Identifier = "LicenseRef-OpenPEP-Media"

[[annotations]]
path = ["apps/openpep-rx/README.md", "apps/openpep-rx/LICENSING.md", "apps/openpep-rx/integracao/openpep/README.md", "apps/openpep-rx/assets/fonts/PROVENANCE.json", "apps/openpep-rx/assets/fonts/pdf/README.md", "apps/openpep-rx/NOTICE", "apps/openpep-rx/sbom.cdx.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti and OpenPEP contributors"
SPDX-License-Identifier = "CC-BY-4.0"


[[annotations]]
path = ["apps/openpep-rx/local/prepare-pdf.mjs"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti"
SPDX-License-Identifier = "Apache-2.0"


[[annotations]]
path = ["apps/openpep-rx/fixtures/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 OpenPEP contributors"
SPDX-License-Identifier = "CC0-1.0"


[[annotations]]
path = ["apps/openpep-rx/assets/openpep-mark.png"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-OpenPEP-Brand"


[[annotations]]
path = ["apps/openpep-rx/assets/fonts/*.ttf", "apps/openpep-rx/assets/fonts/pdf/*.ttf", "apps/openpep-rx/assets/fonts/OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"


[[annotations]]
path = ["apps/openpep-rx/references/anvisa-modelos/**"]
precedence = "override"
SPDX-FileCopyrightText = "Agencia Nacional de Vigilancia Sanitaria (Anvisa)"
SPDX-License-Identifier = "LicenseRef-Anvisa-Reference"


[[annotations]]
path = ["apps/openpep-rx/data/**"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-Anvisa-Catalogs"

[[annotations]]
path = "apps/openpep-rx/data/PROVENANCE.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Carlos Pedrotti and OpenPEP contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["tools/cockpit-pdf/data/**", "tools/cockpit-pdf/src/termos.json", "apps/macos/OpenPEP/Resources/CockpitPDF/medication-assistance.json"]
